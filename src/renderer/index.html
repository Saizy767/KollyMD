<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KollyMD</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <h2 id="vault-path">No vault selected</h2>
    </div>
    <div id="command-bar">
      <div class="cmd-spacer"></div>
      <button class="cmd-btn" title=""><span class="cmd-delete">−</span></button>
      <button class="cmd-btn" title=""><span class="cmd-delete">−</span></button>
      <button class="cmd-btn" title=""><span class="cmd-delete">−</span></button>
      <div class="cmd-add-zone">
        <button class="cmd-add" title="Add command">+</button>
      </div>
    </div>
    <div id="explorer">
      <ul id="explorer-tree"></ul>
    </div>
    <div id="sidebar-footer">
      <button id="select-dir" title="Select Directory">...</button>
      <div id="selected-group">
        <span id="selected-label">Selected:</span>
        <span id="explorer-status"></span>
      </div>
    </div>
  </aside>
  <div id="sidebar-resizer"></div>
  <main id="main">
    <div id="tabs"><ul id="tabs-list"></ul></div>
    <div id="editor-bar">
      <span id="doc-status">No document</span>
    </div>
    <div id="editor-host"></div>
    <ul id="backlinks"></ul>
  </main>
  <div id="prompt-dialog" hidden>
    <div id="prompt-box">
      <span id="prompt-message"></span>
      <input id="prompt-input" type="text">
      <div id="prompt-buttons">
        <button id="prompt-ok">OK</button>
        <button id="prompt-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
