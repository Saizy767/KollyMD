<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KollyMD</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <button id="select-dir">Select Directory</button>
      <span id="vault-path">No vault selected</span>
    </div>
    <div id="search-bar">
      <input id="search" type="text" placeholder="Search notes...">
      <button id="search-btn">Search</button>
      <span id="search-status"></span>
    </div>
    <div id="explorer">
      <button id="refresh-explorer">Refresh</button>
      <ul id="explorer-tree"></ul>
      <span id="explorer-status"></span>
    </div>
    <ul id="search-results"></ul>
  </aside>
  <main id="main">
    <div id="tabs"><ul id="tabs-list"></ul></div>
    <div id="editor-bar">
      <span id="doc-status">No document</span>
    </div>
    <div id="editor-host"></div>
    <ul id="backlinks"></ul>
  </main>
  <div id="prompt-dialog" hidden>
    <div id="prompt-box">
      <span id="prompt-message"></span>
      <input id="prompt-input" type="text">
      <div id="prompt-buttons">
        <button id="prompt-ok">OK</button>
        <button id="prompt-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
